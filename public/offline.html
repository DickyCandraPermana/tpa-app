<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SibaQ - Sedang Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #064E3B;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #042F2E;
      border: 1px solid #115E59;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #F3E8D6;
    }
    p {
      font-size: 13px;
      color: #99F6E4;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background-color: #059669;
      color: #FFFFFF;
      border: 1px solid #047857;
      border-radius: 14px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    button:active {
      background-color: #047857;
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📖</div>
    <h1>Mode Offline SibaQ</h1>
    <p>Koneksi internet Anda sedang terputus. Silakan periksa jaringan dan muat ulang halaman.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
